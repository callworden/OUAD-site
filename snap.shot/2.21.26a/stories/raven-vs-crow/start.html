<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raven vs Crow Chronicles - Hyperbaby Games</title>
    <link rel="stylesheet" href="../../styles/main.css">
    <link rel="stylesheet" href="../../styles/story-reader.css">
</head>
<body class="story-reader-body">
    
    <!-- Story Reader Container -->
    <div class="story-container">
        
        <!-- Story Header -->
        <div class="story-header">
            <div class="story-nav">
                <a href="/stories.html" class="back-link">← Back to Stories</a>
                <div class="story-controls">
                    <button id="saveBtn" class="control-btn">💾 Save</button>
                    <button id="resetBtn" class="control-btn">🔄 Restart</button>
                    <button id="settingsBtn" class="control-btn">⚙️</button>
                </div>
            </div>
            <div class="story-title-area">
                <h1 id="storyTitle">Loading...</h1>
                <p id="storyDescription" class="story-subtitle"></p>
            </div>
        </div>

        <!-- Progress Indicator -->
        <div class="story-progress-bar">
            <div id="progressFill" class="progress-fill"></div>
        </div>

        <!-- Main Story Content -->
        <main class="story-main">
            <div class="chapter-container">
                <div id="chapterTitle" class="chapter-title"></div>
                <div id="chapterContent" class="chapter-content">
                    <!-- Story paragraphs will be inserted here -->
                </div>
                <div id="chapterChoices" class="chapter-choices">
                    <!-- Choice buttons will be inserted here -->
                </div>
            </div>

            <!-- Metadata Sidebar -->
            <aside class="story-sidebar">
                <div class="sidebar-section">
                    <h3>Current Status</h3>
                    <div id="currentLocation" class="status-item">
                        <span class="status-label">Location:</span>
                        <span class="status-value">—</span>
                    </div>
                    <div id="currentMood" class="status-item">
                        <span class="status-label">Atmosphere:</span>
                        <span class="status-value">—</span>
                    </div>
                </div>

                <div class="sidebar-section">
                    <h3>Relationships</h3>
                    <div id="relationships">
                        <div class="relationship-item">
                            <span>Raven Kingdom</span>
                            <div class="relationship-bar">
                                <div id="ravenTrustBar" class="trust-fill raven" style="width: 50%"></div>
                            </div>
                        </div>
                        <div class="relationship-item">
                            <span>Crow Empire</span>
                            <div class="relationship-bar">
                                <div id="crowTrustBar" class="trust-fill crow" style="width: 50%"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="sidebar-section">
                    <h3>Skills Unlocked</h3>
                    <div id="skillsList" class="skills-list">
                        <span class="empty-state">No skills yet</span>
                    </div>
                </div>

                <div class="sidebar-section">
                    <h3>Reputation</h3>
                    <div id="reputationDisplay" class="reputation-badge">
                        Unknown
                    </div>
                </div>
            </aside>
        </main>

        <!-- Story Footer -->
        <footer class="story-footer">
            <div class="auto-save-indicator">
                <span id="saveStatus">●</span>
                <span>Progress auto-saved</span>
            </div>
        </footer>
    </div>

    <!-- Settings Modal (hidden by default) -->
    <div id="settingsModal" class="modal hidden">
        <div class="modal-content">
            <h2>Settings</h2>
            <div class="setting-item">
                <label for="fontSize">Text Size</label>
                <select id="fontSize">
                    <option value="small">Small</option>
                    <option value="medium" selected>Medium</option>
                    <option value="large">Large</option>
                </select>
            </div>
            <div class="setting-item">
                <label for="autoSave">Auto-Save</label>
                <input type="checkbox" id="autoSave" checked>
            </div>
            <button id="closeSettings" class="btn btn-primary">Close</button>
        </div>
    </div>

    <script src="../../scripts/story-engine.js"></script>
</body>
</html>
