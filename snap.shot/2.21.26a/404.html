<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Hyperbaby Games</title>
    <link rel="stylesheet" href="/styles/main.css">
    <style>
        .error-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 4rem 2rem;
            text-align: center;
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .error-code {
            font-size: 8rem;
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(135deg, var(--accent-red), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
        }
        
        .error-title {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        
        .error-description {
            color: var(--text-secondary);
            font-size: 1.2rem;
            margin-bottom: 2rem;
            max-width: 600px;
        }
        
        .error-links {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="main-nav">
        <div class="nav-container">
            <a href="/" class="logo">Hyperbaby</a>
            <div class="nav-links">
                <a href="/">Home</a>
                <a href="/games.html">Games</a>
                <a href="/stories.html">Stories</a>
                <a href="/shop.html">Shop</a>
                <a href="/news.html">News</a><a href="/about.html">About</a>
                <a href="/contact.html">Contact</a>
            </div>
        </div>
    </nav>

    <!-- Error Content -->
    <div class="error-container">
        <div class="error-code">404</div>
        <h1 class="error-title">Page Not Found</h1>
        <p class="error-description">
            Looks like this page wandered off into the neutral territories. 
            Maybe a crow stole it. Or a raven. Hard to say.
        </p>
        <div class="error-links">
            <a href="/" class="btn btn-primary">Return Home</a>
            <a href="/stories.html" class="btn btn-secondary">Browse Stories</a>
            <a href="/games.html" class="btn btn-secondary">Browse Games</a>
        </div>
    </div>

    <!-- Footer -->
    <footer class="main-footer">
        <div class="footer-content">
            <p>&copy; 2026 Hyperbaby Games. Built on Alma + Nginx.</p>
            <div class="footer-links">
                <a href="/shop.html">Store</a>
                <a href="/contact.html">Contact</a>
                <a href="/press.html">Press Kit</a>
            </div>
        </div>
    </footer>
</body>
</html>
