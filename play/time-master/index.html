<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Time Master Art Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* VOICE: an Agency case terminal; plain, dry, clear. No art yet: the logic is the game
   IDEA: a ticket workstation where a read-only slice of history becomes writable
   PICTURE: the splash seal and the timeline chain; everything else is cards
   COLOUR and TYPE: graphite + Agency teal, warning red, one gold for ratings; Chakra Petch UI, Spectral for documents
   LAYOUT: splash, then sticky header + tabs; one column on phones, a card grid on wide screens */
:root{color-scheme:dark;--bg:#0d1416;--panel:#142023;--panel2:#1a2a2e;--line:#2a3f43;--ink:#e8f1ee;--quiet:#9ab0ac;--teal:#3fd2c7;--warn:#ff6a5c;--ok:#7fd99a;--gold:#e8c35a;--paper:#efe6d2;--sepia:#2d2418}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Chakra Petch',system-ui,sans-serif;overflow-x:clip}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.hidden{display:none!important}
/* splash */
#splash{min-height:100vh;background:radial-gradient(ellipse at 75% 10%,#173436 0,transparent 55%),repeating-linear-gradient(0deg,transparent 0 39px,#132226 39px 40px),repeating-linear-gradient(90deg,transparent 0 39px,#132226 39px 40px),var(--bg);padding:clamp(24px,5vw,64px) max(5vw,16px) 48px}
.sp-in{max-width:1080px;margin:0 auto}
.brand{display:flex;align-items:center;gap:16px}
.brand svg{width:64px;height:64px;flex:none}
.brand small{display:block;color:var(--quiet);font-size:15px}
.brand h1{margin:0;font-size:clamp(36px,6vw,56px);line-height:1.02;font-weight:700}
.premise{font-size:18px;max-width:68ch;color:#d6e2df;margin:22px 0 26px}
.sp-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px}
.case{background:var(--paper);color:var(--sepia);border-radius:12px;padding:18px 20px;font-family:Spectral,Georgia,serif}
.case small{font-family:'Chakra Petch',sans-serif;color:#6b5a40;font-size:14px;font-weight:600}
.case h2{margin:2px 0 6px;font-size:28px;line-height:1.1}
.case p{margin:0 0 8px;font-size:17px}
.steps{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:6px;font-family:'Chakra Petch',sans-serif;font-size:15px}
.steps li{display:flex;gap:10px}.steps b{flex:none;width:24px;height:24px;border-radius:50%;background:#2d2418;color:var(--paper);display:grid;place-items:center;font-size:13px}
.diffs{display:grid;gap:10px}
.diff{display:block;text-align:left;width:100%;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:14px 16px}
.diff[aria-checked=true]{border-color:var(--teal);background:#122a29}
.diff b{font-size:19px}.diff span{display:block;color:var(--quiet);font-size:15px;line-height:1.4}
.diff em{font-style:normal;color:var(--gold);font-size:13px;font-weight:700;float:right}
.start{margin-top:14px;width:100%;background:var(--teal);color:#062022;font-weight:700;font-size:20px;padding:14px;border-radius:12px;min-height:52px}
/* game */
header{position:sticky;top:0;z-index:5;background:rgba(13,20,22,.96);border-bottom:1px solid var(--line);padding:10px max(4vw,14px) 0}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top h1{margin:0;font-size:18px;line-height:1.2;font-weight:700}
.top h1 span{color:var(--quiet);font-weight:400}
.badge{font-size:13px;font-weight:700;padding:3px 9px;border-radius:6px;white-space:nowrap}
.badge.ro{background:#3a1f1c;color:var(--warn)}.badge.rw{background:#143a31;color:var(--ok)}.badge.d{background:#2a2a16;color:var(--gold)}
.top .gap{flex:1}
.hb{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 12px;font-size:15px;font-weight:600;min-height:40px}
nav{display:flex;gap:2px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
nav button{flex:none;padding:10px 12px;font-size:15px;font-weight:600;color:var(--quiet);border-bottom:3px solid transparent;white-space:nowrap;min-height:44px}
nav button[aria-selected=true]{color:var(--ink);border-color:var(--teal)}
nav button:disabled{opacity:.35;cursor:not-allowed}
main{padding:18px max(4vw,14px) 130px;max-width:1180px;margin:0 auto}
main.wide{max-width:1680px;padding-left:max(2.5vw,12px);padding-right:max(2.5vw,12px)}
h2{font-size:26px;line-height:1.15;margin:4px 0 6px}
h3.sec{margin:20px 0 8px;font-size:18px}
.lead{color:var(--quiet);margin:0 0 16px;max-width:72ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.card h3{margin:0;font-size:18px;line-height:1.2}
.card .d{margin:0;color:#cfdcd9;font-size:15px}
.card ul{margin:0;padding-left:18px;font-size:15px}
.card ul li{margin:2px 0}
.card .state{font-size:13px;font-weight:700;color:var(--teal)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.a{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:8px 12px;font-size:14px;font-weight:600;min-height:40px}
.a.pri{background:var(--teal);border-color:var(--teal);color:#062022}
.a.red{border-color:#6b2e28;color:#ffb3aa}
.doc{font-family:Spectral,Georgia,serif;background:var(--paper);color:var(--sepia);border-radius:10px;padding:16px 18px}
.doc h3{font-family:'Chakra Petch',sans-serif;font-size:15px;margin:0 0 8px;color:#6b5a40;font-weight:600}
.doc p{margin:0 0 8px;font-size:17px}
.doc table{border-collapse:collapse;font-size:17px;width:100%}
.doc td{padding:2px 8px 2px 0;border-bottom:1px solid #d8cdb4}
.doc.alert{background:#2a1513;color:#ffd9d4;border:1px solid #6b2e28}
.doc.alert h3{color:#ff9d92}
.g{font-family:'Segoe UI Symbol','Noto Sans Symbols 2','Apple Symbols',system-ui,sans-serif;font-size:20px;letter-spacing:2px;white-space:nowrap}
.manual{border:1px solid var(--teal);background:#10221f}
.lock{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;max-width:560px}
.dial{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.dial label{display:block;color:var(--quiet);font-size:14px}
.dial input{width:100%;font:700 32px 'Chakra Petch',sans-serif;text-align:center;background:#0b1214;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 0;margin-top:6px}
.dial.okd{border-color:var(--ok)}.dial.badd{border-color:var(--warn)}
.msg{margin-top:10px;color:var(--quiet);min-height:24px}
#bench{scroll-margin-top:130px}.bench{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:14px;margin-top:6px}
.bench .card{border-color:#2f6f69;background:#10211f}
.pipes{display:grid;gap:4px;align-items:center;justify-content:start;margin:8px 0}
.tile{width:54px;height:54px;background:#0b1214;border:1px solid var(--line);border-radius:8px;color:#5d7a76;padding:0;display:block}
.tile svg{display:block;width:100%;height:100%}
.tile.lit{color:var(--teal);border-color:#2f6f69}
.term{font-size:13px;color:var(--quiet);padding:0 4px;white-space:nowrap}
.jugs{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0}
.jug{width:96px;text-align:center}
.jug .v{height:110px;border:2px solid var(--line);border-top:0;border-radius:0 0 12px 12px;position:relative;overflow:hidden;background:#0b1214}
.jug .f{position:absolute;left:0;right:0;bottom:0;background:#4fb3d9}
.jug.pan .f{background:#e07a3a}
.jug b{display:block;font-size:15px;margin-top:4px}
.code{display:flex;gap:8px}
.code input{width:56px;font:700 28px 'Chakra Petch',sans-serif;text-align:center;background:#0b1214;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 0}
.chain{list-style:none;margin:10px 0;padding:0}
.chain li{display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:start;padding:10px 0;border-left:2px solid var(--line);margin-left:17px}
.chain li .n{width:34px;height:34px;border-radius:50%;background:var(--panel2);border:2px solid var(--line);display:grid;place-items:center;font-weight:700;margin-left:-18px}
.chain li.ok .n{background:#143a31;border-color:var(--ok);color:var(--ok)}
.chain li.bad .n{background:#3a1f1c;border-color:var(--warn);color:var(--warn)}
.chain li .t b{display:block}
.chain li .t span{color:var(--quiet);font-size:15px}
.chain li.bad .t span{color:#ffb3aa}
.drift{display:flex;gap:4px;align-items:center}
.drift i{width:12px;height:18px;border-radius:3px;background:#2a3b3e}.drift i.on{background:var(--warn)}
textarea{width:100%;min-height:220px;background:#0b1214;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px;font:16px/1.5 'Chakra Petch',sans-serif}
#comms{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(13,20,22,.97);border-top:1px solid var(--line);padding:10px max(4vw,14px);display:flex;gap:12px;align-items:center}
#comms .who{font-size:13px;color:var(--quiet);font-weight:600;display:block}
#comms .face{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;color:#062022;background:var(--teal)}
#comms #ctext{font-size:15px;line-height:1.35}
table.truth{width:100%;border-collapse:collapse;font-size:15px}
table.truth th,table.truth td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.okc{color:var(--ok)}.badc{color:var(--warn)}
.rank{background:var(--panel);border:1px solid var(--gold);border-radius:12px;padding:16px 18px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin:12px 0}
.rank .big{font-size:48px;font-weight:700;line-height:1;color:var(--gold)}
.rank b{font-size:22px;display:block}
.log{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 18px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;max-width:560px}
.log span:nth-child(even){text-align:right;font-weight:700;color:var(--teal)}
#confirm{position:fixed;inset:0;background:rgba(3,7,8,.7);z-index:9;display:grid;place-items:center;padding:20px}
#confirm .card{max-width:420px}
.scenebar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 10px}
.scenewrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}
.scene{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#120c18}
.scene svg{display:block;width:100%;height:auto}
.scene.shake{animation:shake .55s}
@keyframes shake{15%{transform:translate(-1.2%,.6%)}35%{transform:translate(1%,-.7%)}55%{transform:translate(-.7%,.4%)}75%{transform:translate(.4%,-.2%)}}
.hs{fill:transparent;cursor:pointer;stroke:transparent;stroke-width:4}
.hs:hover,.hs:focus{stroke:rgba(255,240,210,.8);stroke-dasharray:12 8;outline:none}
.reveal .hs{stroke:rgba(127,217,154,.75);stroke-dasharray:12 8}
.hs.sel{stroke:var(--gold)!important;stroke-dasharray:none!important;stroke-width:5}
.tw{animation:tw var(--d) ease-in-out infinite;animation-delay:var(--dl)}
@keyframes tw{0%,100%{opacity:.1}50%{opacity:1}}
.dust{animation:dust var(--d) linear infinite;animation-delay:var(--dl)}
@keyframes dust{from{transform:translateX(-560px)}to{transform:translateX(1260px)}}
#rocketG{transform-box:view-box;transform-origin:790px 68px;animation:sway 5s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
#rocketG.bump{animation:swing 1.8s ease-out}
@keyframes swing{0%{transform:rotate(0)}12%{transform:rotate(26deg)}30%{transform:rotate(-18deg)}50%{transform:rotate(10deg)}70%{transform:rotate(-5deg)}100%{transform:rotate(0)}}
#sweep{transform-box:view-box;transform-origin:555px 396px;animation:spin 4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#needle{transform-box:view-box;transform-origin:1106px 398px;animation:jit 1.8s ease-in-out infinite}
@keyframes jit{0%,100%{transform:rotate(-38deg)}50%{transform:rotate(-30deg)}}
#needle.bump{animation:nj 1.5s ease-out}
@keyframes nj{0%{transform:rotate(-35deg)}20%{transform:rotate(75deg)}60%{transform:rotate(45deg)}100%{transform:rotate(-35deg)}}
#hglow{animation:hp 2.4s ease-in-out infinite}
@keyframes hp{0%,100%{opacity:.35}50%{opacity:.75}}
#hdoor{transform-box:view-box;transform-origin:1292px 668px;transition:transform .5s ease-in}
#hdoor.opening{transform:scaleX(0)}
.steam{animation:steam 2.6s ease-in infinite}
@keyframes steam{0%{transform:translateY(0);opacity:0}30%{opacity:.85}100%{transform:translateY(-70px);opacity:0}}
.vaulting{animation:vout .65s ease-in forwards;transform-box:fill-box;transform-origin:center}
@keyframes vout{40%{transform:scale(1.12);filter:brightness(1.8) drop-shadow(0 0 14px #3fd2c7)}100%{transform:scale(.05);opacity:0}}
.cupg{transform-box:view-box}
#handG{transform-box:view-box;transform-origin:238px 580px;animation:hsway 5.5s ease-in-out infinite}
@keyframes hsway{0%,100%{transform:rotate(0)}30%{transform:rotate(3deg)}70%{transform:rotate(-2deg)}}
#handG.bump{animation:hjolt 1.1s ease-out}
@keyframes hjolt{0%{transform:rotate(0)}25%{transform:rotate(9deg)}60%{transform:rotate(-4deg)}100%{transform:rotate(0)}}
#lids{opacity:0;animation:doze 18s ease-in-out infinite}
@keyframes doze{0%,10%{opacity:0}22%{opacity:.5}26%{opacity:.12}40%{opacity:.7}44%{opacity:.3}58%{opacity:1}90%{opacity:1}91%,100%{opacity:0}}.cupg.bump{animation:swing 1.8s ease-out}
.toast{position:fixed;left:50%;top:118px;transform:translate(-50%,-10px);z-index:20;background:#10221f;border:1px solid var(--teal);color:var(--ink);border-radius:12px;padding:10px 18px 10px 14px;display:flex;gap:10px;align-items:center;font-weight:600;font-size:16px;box-shadow:0 10px 30px rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:min(92vw,560px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast i{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;font-style:normal;font-weight:700;background:var(--teal);color:#062022}
.toast.bad{border-color:#6b2e28;background:#2a1513}.toast.bad i{background:var(--warn)}
.pwrap{position:relative}
.pclose{position:absolute;right:8px;top:8px;z-index:2;width:36px;height:36px;border-radius:50%;background:rgba(13,20,22,.85);border:1px solid var(--line);font-size:20px;line-height:1;color:var(--ink)}
.vm{position:fixed;inset:0;z-index:15;background:rgba(3,7,8,.72);display:flex;align-items:center;justify-content:center;overflow:hidden;padding:clamp(8px,2vw,24px)}
.vm-box{width:min(1240px,100%);height:auto;max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow:hidden;display:flex;flex-direction:column;background:var(--bg);border:1px solid #2f6f69;border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.vm-head{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.vm-head h2{margin:0;flex:1;font-size:22px}
.vm-body{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;padding:16px 18px;overflow:hidden;min-height:0;flex:1}
.vm-col{overflow:auto;min-height:0;padding-right:4px}
.vm-col h3.sec{margin:0 0 8px}
.vm-shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:10px}
.vm-shelf .card .thumb{height:80px}
.vm-empty{border:1px dashed var(--line);border-radius:12px;padding:18px;color:var(--quiet)}
@media(max-width:820px){.vm-body{grid-template-columns:minmax(0,1fr);grid-auto-rows:max-content;overflow:auto;padding:12px}.vm-col{overflow:visible;min-height:auto}.vm-head{padding:10px 12px}.pipes .term{font-size:11px}}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.thumb{width:100%;height:110px;object-fit:contain;background:#0f191b;border-radius:8px;display:block}
#panel .card{border-color:#2f6f69}
@media(max-width:900px){.scenewrap{grid-template-columns:minmax(0,1fr)}}
@media(prefers-reduced-motion:reduce){#handG{animation:none}#lids{animation:none;opacity:0}.tw,.dust,#rocketG,#sweep,#needle,#hglow,.steam{animation:none}}
@media(max-width:760px){.sp-grid{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){h2{font-size:22px}.dial input{font-size:26px}.tile{width:46px;height:46px}
 table.truth thead{display:none}table.truth tr{display:grid;grid-template-columns:1fr auto;padding:6px 0;border-bottom:1px solid var(--line)}table.truth td{border:0;padding:2px 0}}
</style>
</head>
<body>
<section id="splash"></section>
<div id="game" class="hidden">
<header>
  <div class="top"><h1>Case 001 · The Soup Incident</h1><span class="badge d" id="diffBadge"></span><span class="badge ro" id="slice">Slice: read-only</span><span class="drift hidden" id="drift" title="Drift"></span><span class="gap"></span><button class="hb" id="soundBtn" aria-pressed="true">Sound on</button><button class="hb" id="hintBtn">Hint</button><button class="hb" id="menuBtn">Restart</button></div>
  <nav role="tablist" id="tabs">
    <button role="tab" data-t="dossier" aria-selected="true">Dossier</button>
    <button role="tab" data-t="lock">Time lock</button>
    <button role="tab" data-t="cabin" disabled>The cabin</button>
    <button role="tab" data-t="vault" disabled>Vault and workbench</button>
    <button role="tab" data-t="run" disabled>Run the timeline</button>
    <button role="tab" data-t="notes">Notebook</button>
  </nav>
</header>
<main id="main"></main>
<div id="comms"><div class="face" id="cface">M</div><div><span class="who" id="cwho">Field Manual</span><span id="ctext"></span></div></div>
</div>
<div class="vm hidden" id="vm" role="dialog" aria-modal="true" aria-labelledby="vmTitle"><div class="vm-box"><div class="vm-head"><h2 id="vmTitle">Vault and workbench</h2><button class="a" id="vmClose">Close</button></div><div class="vm-body" id="vmBody"></div></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"><i id="toastIcon">✓</i><span id="toastText"></span></div>
<div id="confirm" class="hidden"><div class="card"><h3>Leave this case?</h3><p class="d">Your progress on this attempt will be lost.</p><div class="acts"><button class="a red" id="cRestart">Restart this difficulty</button><button class="a" id="cSplash">Change difficulty</button><button class="a pri" id="cStay">Keep playing</button></div></div></div>

<script>
{
/* =====================================================================
   STORY SLOTS: replace these freely. The puzzles don't depend on them.
   ===================================================================== */
const STORY={
  premise:"The United Agency of Time Alignment is very old, very large and very underfunded. It handles complaints about history from every corner of the universe. When something that should have happened didn't, someone files a ticket. You are a junior Time Master, and the backlog is forty thousand years deep.",
  agencyNote:"The Agency's position is simple: history happened the way it happened, and we put it back. Even when it was an accident. Especially when it was an accident.",
  thieves:"Omnibus Mutual Assurance insures the galaxy against acts of history. Its subsidiary, Omnibus Lightspeed Holdings, would like to own a few of them.",
  ottoline:"Ottoline Brask flew the Bleak line for nineteen years. She was not ambitious. She was hungry.",
  closer:"Faster-than-light travel now belongs to nobody, which is to say everybody, which is to say, technically, a soup."
};

const $=id=>document.getElementById(id);
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const glyph=n=>{let o='';[[27,'◇'],[9,'□'],[3,'△'],[1,'○']].forEach(([v,g])=>{while(n>=v){o+=g;n-=v}});return o};
const G=t=>`<span class="g">${t}</span>`;
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ---------- sound: everything synthesised, no files ---------- */
const Snd={ctx:null,out:null,amb:null,muted:store.get('tm.mute')===true,
  init(){if(this.ctx)return;try{const C=window.AudioContext||window.webkitAudioContext;this.ctx=new C();const comp=this.ctx.createDynamicsCompressor();comp.threshold.value=-18;comp.connect(this.ctx.destination);this.out=this.ctx.createGain();this.out.gain.value=this.muted?0:1;this.out.connect(comp)}catch(e){this.ctx=null}},

  if(s.bench==='hotplate'){const g=s.pipes,N=g.length,L=lit(g);
    return `<div class="bench" id="bench"><div class="card"><h3>Workbench: hotplate</h3><p class="d">The SafeWarm coil is out and the copper coil is in. Turn the tiles so power runs from the socket on the left to the coil on the right.</p>
    <div class="pipes" style="grid-template-columns:auto repeat(${N},auto) auto">${g.map((row,r)=>`<span class="term">${r===0?'Socket ▶':''}</span>${row.map((m,c)=>`<button class="tile ${L.on.has(r+','+c)?'lit':''}" data-tile="${r},${c}" aria-label="Tile row ${r+1} column ${c+1}, tap to turn">${tileSVG(m)}</button>`).join('')}<span class="term">${r===N-1?'▶ Coil':''}</span>`).join('')}</div>
    <div class="msg">${L.out?'Connected.':'Not connected yet.'}</div><div class="acts"><button class="a" data-act="closebench">Put it down for now</button></div></div></div>`}
  if(s.bench==='soup'){const j=s.jugs,J=D.jug,bar=(v,max)=>`<div class="v"><div class="f" style="height:${Math.min(100,v/max*100)}%"></div></div>`;
    return `<div class="bench" id="bench"><div class="card"><h3>Workbench: thin the ${esc(ITEMS[s.benchFor].name.replace('Saucepan of ',''))}</h3><p class="d">Read the recipe on the pan. You have a ${jl(J.a)}-cup jug, a ${jl(J.b)}-cup jug and a tap. Every drop you pour into the soup stays in the soup.</p>
    <div class="jugs"><div class="jug">${bar(j.a,J.a)}<b>Jug ${G(jl(J.a))}: ${jl(j.a)||'empty'}</b></div><div class="jug">${bar(j.b,J.b)}<b>Jug ${G(jl(J.b))}: ${jl(j.b)||'empty'}</b></div><div class="jug pan">${bar(j.pan,(s.benchFor==='pea'?J.tp:J.t)+2)}<b>Soup: +${jl(j.pan)||'0'}</b></div></div>
    <div class="acts"><button class="a" data-jug="fa">Fill small jug</button><button class="a" data-jug="fb">Fill big jug</button><button class="a" data-jug="ab">Small into big</button><button class="a" data-jug="ba">Big into small</button><button class="a" data-jug="ea">Empty small</button><button class="a" data-jug="eb">Empty big</button><button class="a pri" data-jug="ap">Small into soup</button><button class="a pri" data-jug="bp">Big into soup</button></div>
    <div class="msg">${esc(s.benchMsg.soup||'')}</div><div class="acts"><button class="a" data-act="closebench">Put it down for now</button></div></div></div>`}
  if(s.bench==='padlock')return `<div class="bench" id="bench"><div class="card"><h3>Workbench: padlock</h3><p class="d">Four dials. It won't come off without the combination. Read what's engraved on it.</p><div class="code">${[0,1,2,3].map(i=>`<input id="pc${i}" inputmode="numeric" maxlength="1" aria-label="Digit ${i+1}" autocomplete="off">`).join('')}</div><div class="acts" style="margin-top:10px"><button class="a pri" id="tryPad">Try it</button><button class="a" data-act="closebench">Leave it for now</button></div><div class="msg">${esc(s.benchMsg.pad||'')}</div></div></div>`;
  return '';
}

/* ---------- run ---------- */
const LINKS=[
 ['The 11 o\'clock ferry departs','Year 76, day 8. Last run before lunch. Ottoline sighs.'],
 ['Lunch goes on the hotplate','Mum\'s carrot soup, orange as the report says.'],
 ['The soup comes to a rolling boil','A proper copper coil does its job.'],
 ['The engine hatch hangs open','The drive runs hot, just as the log says.'],
 ['Debris bumps the hull','A pebble from the Bleak Narrows.'],
 ['The soup spills into the drive','The ferry jumps forty thousand light years.'],
 ['Omnibus Lightspeed Holdings is never founded','No patent. No fares. No company.']
];
function check(){
  const f=(i,why)=>({i,why});
  if(s.loc.guard==='cabin')return f(1,'The spill guard is clamped over the hotplate. Nothing gets near it.');
  if(s.loc.pouch==='cabin')return f(1,'The ration packet is still on the console. Ottoline eats that instead, sadly, and history goes beige.');
  if(!s.onPlate)return f(1,'The hotplate is empty. Ottoline stares at it and decides not to bother.');
  if(s.onPlate==='tin')return f(1,'Comfort Soup goes on. It is, as promised, boil-proof.');
  if(s.onPlate==='pea')return f(1,'Green soup goes on. The incident report says bright orange. History does not do green.');
  if(!s.thinned[s.onPlate])return f(2,'The soup is a solid orange brick. Bricks don\'t boil, or spill.');
  if(!s.repaired)return f(2,'The SafeWarm coil keeps the soup politely tepid. Nothing bubbles over.');
  if(s.loc.padlock==='cabin')return f(3,'The hatch is padlocked. The drive overheats quietly behind it.');
  if(!s.hatchOpen)return f(3,'The hatch is unlocked but shut. The soup slops harmlessly against brass.');
  if(s.loc.drone==='cabin')return f(4,'The drone swats the debris aside. No bump. A very smooth, very slow ride.');
  if(s.loc.pamphlet==='cabin')return f(6,'The ferry jumps, but the pamphlet survives the trip. A historian finds it in year 90, reads the company name, and founds it to see what happens.');
  return null;
}
function run(){
  const fail=s.lastRun;const rows=LINKS.map(([a,b],i)=>{let cls='',sub='';if(fail!==undefined){if(fail===null||i<fail.i){cls='ok';sub=b}else if(i===fail.i){cls='bad';sub=fail.why}}return `<li class="${cls}"><span class="n">${i+1}</span><span class="t"><b>${a}</b><span>${esc(sub)}</span></span></li>`}).join('');
  const rule=dkey==='trainee'?'Runs are unlimited.':dkey==='agent'?'Runs are unlimited, but three or fewer keeps your top rating.':`Each failed run adds drift. Drift ${s.drift} of ${D.drift}: at ${D.drift} the slice snaps back and your cabin work is undone.`;
  return `<h2>Run the timeline</h2><p class="lead">The moment plays out link by link and stops at the first link that breaks. ${rule} Runs so far: ${s.runs}.</p><ol class="chain">${rows}</ol>${s.done?`<p class="lead" style="color:var(--ok)">${esc(STORY.closer)}</p>`:''}<div class="acts">${s.done?'<button class="a pri" id="toReport">See the field report</button>':`<button class="a pri" id="doRun">${s.runs?'Run it again':'Run the timeline'}</button>`}</div>`}
function scoreNow(){
  const mis=Object.keys(ITEMS).filter(k=>!['coil','safewarm','ottoline'].includes(k)).filter(k=>{const t=ITEMS[k].truth,inC=s.loc[k]==='cabin';return (t==='belongs'&&!inC)||(t==='intruder'&&inC&&!ITEMS[k].optional)||(t==='decoy'&&inC)}).length;
  const extraRuns=Math.max(0,s.runs-3);
  let score=100-extraRuns*(dkey==='trainee'?0:8)-s.hints*(dkey==='trainee'?0:6)-mis*10-s.snaps*15-(s.lockTries>3?5:0);
  score=Math.max(0,Math.min(100,score));
  const rank=score>=90?'Time Master':score>=75?'Senior Agent':score>=55?'Field Agent':'Junior Agent, again';
  return {score,rank,mis};
}
function report(){
  const secs=Math.round((s.tDone-s.t0)/1000),lockSecs=Math.round((s.tUnlock-s.t0)/1000),sc=scoreNow();
  const best=store.get('tm.best')||{};const prev=best[dkey];
  const order=['Time Master','Senior Agent','Field Agent','Junior Agent, again'];
  if(!prev||order.indexOf(sc.rank)<order.indexOf(prev)){best[dkey]=sc.rank;store.set('tm.best',best)}
  const rows=Object.keys(ITEMS).filter(k=>!['coil','safewarm'].includes(k)).map(k=>{const it=ITEMS[k],inC=s.loc[k]==='cabin';let v,ok;
    if(it.truth==='belongs'){ok=inC;v=inC?'Left in place':'Vaulted, but it belonged'}
    else if(it.truth==='intruder'){ok=!inC||it.optional;v=inC?(it.optional?'Left: an acceptable anomaly':'Left in the cabin'):'Vaulted'}
    else if(it.truth==='sabotaged'){ok=s.repaired;v=s.repaired?'Repaired':'Not repaired'}
    else if(it.truth==='missing'){ok=inC;v=inC?'Restored':'Left on the shelf'}
    else{ok=!inC;v=inC?'Brought in, but it was a decoy':'Left on the shelf'}
    return `<tr><td>${esc(it.name)}</td><td>${{belongs:'Belongs',intruder:'Intruder',sabotaged:'Sabotaged',missing:'Missing',decoy:'Decoy'}[it.truth]}</td><td class="${ok?'okc':'badc'}">${esc(v)}</td></tr>`}).join('');
  const kit=s.loc.kit==='cabin';
  const log=[['Difficulty',D.name],['Total time',secs+' s'],['Time to unlock the slice',lockSecs+' s'],['Time lock attempts',s.lockTries],['Items inspected',Object.keys(s.seen).length+' of '+(Object.keys(ITEMS).length-1)],['Timeline runs',s.runs],['Failed runs',s.failed],['Snaps (Time Master)',s.snaps],['Hints used',s.hints],['Padlock attempts',s.padTries],['Wrong calls at the end',sc.mis],['Score',sc.score]];
  s.logText=log.map(([a,b])=>a+': '+b).join('\n');
  return `<h2>Ticket resolved</h2><p class="lead">Faster-than-light travel was invented by lunch, on schedule, by a soup. Omnibus Lightspeed Holdings has never existed. ${kit?'You left the first-aid kit: Ottoline burns her hand on the spill and is patched up before the green sun has finished rising. An acceptable anomaly.':'The cabin is exactly as history intended. Ottoline burns her hand on the spill and runs it under the cold tap for the whole first faster-than-light voyage. Correct.'}</p>
  <div class="rank"><div class="big">${sc.score}</div><div><b>${esc(sc.rank)}</b><span style="color:var(--quiet)">${esc(D.name)} difficulty${prev?' · previous best: '+esc(prev):''}</span></div></div>
  <h3 class="sec">Your calls against the truth</h3><table class="truth"><thead><tr><th>Item</th><th>Truth</th><th>What you did</th></tr></thead><tbody>${rows}</tbody></table>
  <h3 class="sec">Playtest log</h3><div class="log">${log.map(([a,b])=>`<span>${esc(a)}</span><span>${esc(b)}</span>`).join('')}</div>
  <div class="acts" style="margin-top:14px"><button class="a pri" id="again">Play again</button><button class="a" id="toSplash">Change difficulty</button><button class="a" id="copyLog">Copy playtest log</button><span id="copied" style="color:var(--quiet);align-self:center"></span></div>`}

/* ---------- actions ---------- */
function bind(){
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>setTab(b.dataset.go));
  document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(b.dataset.act,b.dataset.k));
  const pc=$('pclose');if(pc)pc.onclick=()=>{sfx.click();s.sel=null;cabinRefresh();bind()};
  const sr=$('sceneRun');if(sr){sr.onclick=()=>{if(s.busy||s.done)return;doRun()};sr.disabled=!!s.done;sr.textContent=s.done?'Timeline restored':'Run the timeline'}
  const rb=$('revealBtn');if(rb)rb.onclick=()=>{s.reveal=!s.reveal;cabinRefresh();bind()};
  const tl=$('tryLock');if(tl)tl.onclick=tryLock;
  ['ly','ld','lr'].forEach(id=>{const i=$(id);if(i)i.addEventListener('keydown',e=>{if(e.key==='Enter')tryLock()})});
  document.querySelectorAll('[data-tile]').forEach(b=>b.onclick=()=>{const [r,c]=b.dataset.tile.split(',').map(Number);s.pipes[r][c]=rot(s.pipes[r][c]);sfx.tick();
    if(lit(s.pipes).out){s.repaired=true;s.bench=null;s.loc.coil='used';s.loc.safewarm='shelf';s.seen.safewarm=1;sfx.success();toast('Hotplate repaired: copper coil connected');say('Connected. The copper coil glows a proper, dangerous orange.');s.sel='hotplate';setTab('cabin');return}
    render();});
  document.querySelectorAll('[data-jug]').forEach(b=>b.onclick=()=>jug(b.dataset.jug));
  const tp=$('tryPad');if(tp)tp.onclick=tryPad;
  const dr=$('doRun');if(dr)dr.onclick=doRun;
  const tr=$('toReport');if(tr)tr.onclick=()=>setTab('report');
  const ag=$('again');if(ag)ag.onclick=begin;
  const ts=$('toSplash');if(ts)ts.onclick=()=>{splash();scrollTo(0,0)};
  const na=$('notesArea');if(na)na.oninput=()=>{s.notes=na.value};
  const cl=$('copyLog');if(cl)cl.onclick=()=>{try{navigator.clipboard.writeText(s.logText).then(()=>$('copied').textContent='Copied',()=>$('copied').textContent='Copy blocked here')}catch(e){$('copied').textContent='Copy blocked here'}};
}
function tryLock(){
  const v=[+$('ly').value,+$('ld').value,+$('lr').value];s.lockTries++;
  s.lockOk=[v[0]===DATE.year,v[1]===DATE.day,v[2]===DATE.run];const n=s.lockOk.filter(Boolean).length;
  if(n===3){sfx.unlock();toast('Time lock open: the slice is writable');s.unlocked=true;s.tUnlock=Date.now();say('The slice is writable. Go and see what Omnibus has done to the cabin.');setTab('lock');return}
  sfx.bad();render();['ly','ld','lr'].forEach((id,i)=>$(id).value=v[i]||'');
  $('lmsg').textContent=D.lockDetail?`${n} of 3 dials hold. Green dials are right.`:`${n} of 3 dials hold. The slice stays read-only.`;
}
function act(a,k){
  const it=ITEMS[k];
  if(a==='inspect'){sfx.inspect();s.seen[k]=1;if(k==='ottoline')say('Last run before lunch. Can\'t come soon enough.','Ottoline Brask');render();return}
  if(a==='vault'){
    const LMAP={guard:'L-cage',pouch:'L-packet',pamphlet:'L-pamphlet',kit:'L-kit',drone:'L-drone',rocket:'rocketG',carrot:'L-orange',pea:'L-green',tin:'tinOn'};
    const commit=()=>{if(k===s.onPlate)s.onPlate=null;s.loc[k]='shelf';if(s.sel===k)s.sel=null;say(`${it.name} vaulted.`);toast(`Vaulted: ${it.name}`);render()};sfx.vault();
    const el=s.tab==='cabin'&&$(LMAP[k]);if(el){s.busy=true;el.classList.add('vaulting');setTimeout(()=>{el.classList.remove('vaulting');s.busy=false;commit()},650);return}
    commit();return}
  if(a==='unlock'){s.bench='padlock';s.benchMsg.pad='';setTab('vault');say('Locked, it counts as part of the ship, and the Vault won\'t take it. Find the combination.');return}
  if(a==='bring'){sfx.place();toast(`Back in the cabin: ${it.name}`);s.loc[k]='cabin';say(`${it.name} is in the cabin.`);render();return}
  if(a==='hatch'){const d=$('hdoor');
    if(!s.hatchOpen&&d&&s.tab==='cabin'){sfx.creak();toast('Engine hatch open');s.busy=true;d.classList.add('opening');$('L-hatchpatch').animate([{opacity:1},{opacity:0}],{duration:500,fill:'forwards'});setTimeout(()=>{s.busy=false;s.hatchOpen=true;d.classList.remove('opening');$('L-hatchpatch').getAnimations().forEach(x=>x.cancel());say('The hatch swings open. Heat rolls out of the drive.');render()},520);return}
    sfx.creak();s.hatchOpen=!s.hatchOpen;say(s.hatchOpen?'The hatch swings open. Heat rolls out of the drive.':'The hatch is shut again.');render();return}
  if(a==='plate'){
    if(s.loc.guard==='cabin'){sfx.bad();toast('The spill guard is in the way','bad');say('The spill guard is in the way.');return}
    if(s.onPlate&&s.onPlate!==k){sfx.bad();say('Something is already on the hotplate. Vault it first.');return}
    sfx.place();toast(`On the hotplate: ${it.name}`);s.onPlate=k;s.loc[k]='cabin';s.sel=k;say(`${it.name} is on the hotplate.`);setTab('cabin');return}
  if(a==='bench'){
    if(k==='hotplate'){if(s.loc.coil!=='shelf'){say('You need a replacement coil from the Vault shelf.');return}s.bench='hotplate';if(!s.pipes)s.pipes=newPipes(D.pipe);setTab('vault');say('Hotplate on the workbench. Turn the tiles to connect the socket to the coil.');return}
    s.bench='soup';s.benchFor=k;s.jugs={a:0,b:0,pan:0};s.benchMsg.soup='';render();return}
  if(a==='closebench'){s.bench=null;render()}
}
function jug(op){const j=s.jugs,J=D.jug,T=s.benchFor==='pea'?J.tp:J.t;if(op[0]==='f')sfx.fill();else if(op[0]==='e')sfx.tick();else sfx.pour();
  if(op==='fa')j.a=J.a;if(op==='fb')j.b=J.b;if(op==='ea')j.a=0;if(op==='eb')j.b=0;
  if(op==='ab'){const t=Math.min(j.a,J.b-j.b);j.a-=t;j.b+=t}if(op==='ba'){const t=Math.min(j.b,J.a-j.a);j.b-=t;j.a+=t}
  if(op==='ap'){j.pan+=j.a;j.a=0}if(op==='bp'){j.pan+=j.b;j.b=0}
  if(j.pan>T){sfx.bad();toast('Too much water: start again','bad');s.benchMsg.soup=`Too much water. That's ${jl(j.pan)} cups and the soup is basically a puddle. You scrape it back to a solid brick and start again.`;j.pan=0}
  else if(j.pan===T){sfx.success();toast(`Soup thinned: exactly ${jl(T)} cups`);s.thinned[s.benchFor]=true;s.bench=null;say(`Exactly ${jl(T)} cups. Thick, glossy and ready.`)}
  else s.benchMsg.soup=j.pan?`The soup has ${jl(j.pan)} cup${j.pan>1?'s':''} of water so far.`:'';
  render();}
function tryPad(){const code=[0,1,2,3].map(i=>$('pc'+i).value).join('');s.padTries++;
  const want=D.pad==='reverse'?'7204':'40'+HULL;
  if(code===want){sfx.unlock();sfx.vault();toast('Padlock unlocked and vaulted');s.loc.padlock='shelf';s.bench=null;say('Click. Unlocked, it\'s just a loose padlock, and the Vault takes it. The hatch is unlocked, but still shut.');setTab('cabin');return}
  sfx.bad();s.benchMsg.pad='It doesn\'t budge.';render()}
function doRun(){s.runs++;const f=check();s.lastRun=f;
  if(!f){s.done=true;s.tDone=Date.now();playEnding(()=>{setTab('run');say(STORY.closer,'Omnibus Lightspeed Holdings (formerly)')});return}
  s.failed++;sfx.bad();toast(`Broke at link ${f.i+1} of ${LINKS.length}: ${LINKS[f.i][0]}`,'bad');
  if(D.drift){s.drift++;if(s.drift>=D.drift){s.snaps++;s.drift=0;freshCabin(s);sfx.thud();s.lastRun=undefined;say(`The timeline broke at link ${f.i+1}, and the drift was too much. The slice snapped back: the cabin is exactly as Omnibus left it. Your notes and inspections survive.`);setTab('cabin');return}}
  say(`The timeline breaks at link ${f.i+1}. ${f.why}`);render();if(s.tab==='cabin')flashScene()}
function flashScene(){const sc=$('scene');if(!sc)return;sc.animate([{boxShadow:'0 0 0 0 rgba(255,106,92,0)'},{boxShadow:'0 0 0 6px rgba(255,106,92,.75)'},{boxShadow:'0 0 0 0 rgba(255,106,92,0)'}],{duration:900})}

/* ---------- hints ---------- */
function step(){
  if(s.done)return 'done';
  if(!s.unlocked)return 'lock';
  if(s.loc.guard==='cabin'||s.loc.pouch==='cabin'||s.loc.drone==='cabin')return 'intruders';
  if(s.loc.pamphlet==='cabin')return 'pamphlet';
  if(!s.repaired)return 'coil';
  if(s.onPlate!=='carrot'||!s.thinned.carrot)return 'soup';
  if(s.loc.padlock==='cabin')return 'padlock';
  if(!s.hatchOpen)return 'hatch';
  return 'run';
}
function hints(st){
  const H={
   lock:D.dayHard?['The timetable lists departure times in Brask numerals. Everyone knows when lunch is.','Lunch is at noon, so its numeral is 12. Count the hours around it: ○ is 1, △ is 3, □ is 9, and the fares line tells you what ◇ is worth. The almanac dates the Lantern Fair.','Year ◇◇□□△○ is 76. The Lantern Fair is day △△ (6), so two days later is day 8. The last run before lunch departs at □○○, which is 11.']:['The timetable lists departure times in Brask numerals. Everyone knows when lunch is.','Lunch is at noon, so its numeral is 12. Count the hours around it: ○ is 1, △ is 3, □ is 9. The fares line tells you what ◇ is worth.','Year ◇◇□□△○ is 76, day △△○○ is 8, and the last run before lunch departs at □○○, which is 11.'],
   intruders:['Each intruder gives itself away differently. Test each item against a specific document.','The spec sheet rules out one item, the memoir another, and the incident report a third.','Vault the spill guard (plastic, before year 90), then the food packet (Ottoline never ate from one), then the drone (debris has to hit the ship).'],
   pamphlet:['Not every record in the cabin is first-hand. Rule 2 matters.','Who published that official history? Check the aberration alert.','The pamphlet comes from Omnibus Lightspeed Holdings, founded in year 102. It can\'t be here. Vault it.'],
   coil:['Something that looks right on the outside isn\'t right on the inside.','Inspect the hotplate. Its coil is dated year 80. The original is on the Vault shelf.','Open the hotplate up at the workbench and turn the tiles until power reaches the coil.'],
   soup:['Rule 2: the memoir and the incident report are first-hand. What exactly was on the hotplate?','There are two saucepans on the shelf. The incident report mentions a colour.','Thin the orange carrot soup at the workbench, using exactly the amount on its recipe, then put it on the hotplate.'],
   padlock:D.pad==='reverse'?['The padlock tells you where its combination is.','Something else in the cabin carries the policy number.','The first-aid kit says policy 4027. Backwards, that\'s 7204.']:['The padlock tells you where its combination comes from.','The policy number is on the first-aid kit. The hull number is in the dossier.',`Policy 4027 gives 40. The hull is ${HULL}. The combination is 40${HULL}.`],
   hatch:['The maintenance log has an opinion about the hatch.','Unlocked isn\'t the same as open.','Open the engine hatch from its card in the cabin.'],
   run:['It all looks right to me. Let the timeline tell you.','Rule 3: when in doubt, run it.','Go to Run the timeline and press the button.'],
   done:['Solved. The field report has your results.','Press See the field report.','Run the timeline tab, then See the field report.']};
  return H[st]}
$('hintBtn').onclick=()=>{
  if(s.hints>=D.hintCap&&!s.done){say(`Hint budget spent. Time Masters get ${D.hintCap}.`);return}
  sfx.blip();const st=step();if(s.hStep!==st){s.hStep=st;s.hLvl=0}const i=Math.min(s.hLvl,2);s.hLvl++;if(st!=='done')s.hints++;
  const left=D.hintCap<99&&st!=='done'?` (${D.hintCap-s.hints} left)`:'';say(`Hint ${i+1} of 3${left}: ${hints(st)[i]}`)};

['base','mouse','finale','hand','eyesopen','lids','sky1','sky2','cup','lever','rocket','asteroid','glow','green','orange','cage','kit','drone','pamphlet','packet','hatchpatch','hatchdoor','padlock','P_mug','P_calendar','P_log'].forEach(n=>{const i=new Image();i.src='art/'+n+'.webp'});
window.__tm={get s(){return s},get D(){return D}};
splash();
}
</script>
</body>
