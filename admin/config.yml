backend:
  name: git-gateway
  branch: main

media_folder: images/news
public_folder: /images/news

collections:
  - name: news
    label: News & Updates
    files:
      - name: news_posts
        label: News Posts
        file: _data/news.json
        fields:
          - name: posts
            label: Posts
            label_singular: Post
            widget: list
            summary: "{{fields.title}} - {{fields.date}}"
            fields:
              - name: title
                label: Title
                widget: string
              - name: date
                label: Date
                widget: datetime
                format: YYYY-MM-DD
                date_format: MMMM D, YYYY
                time_format: false
              - name: category
                label: Category
                widget: select
                options:
                  - Company News
                  - Game Update
                  - New Release
                  - Event
                  - Behind the Scenes
                default: Company News
              - name: summary
                label: Summary
                widget: text
              - name: image
                label: Featured Image
                widget: image
                required: false
              - name: body
                label: Post Content
                widget: markdown
