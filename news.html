<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News - Once Upon A Dice</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/pages.css">
    <link rel="stylesheet" href="styles/rebrand.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <style>
        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 2rem;
            max-width: 1100px;
            margin: 0 auto;
            padding: 3rem 2rem;
        }

        .news-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease, border-color 0.3s ease;
            cursor: pointer;
        }

        .news-card:hover {
            transform: translateY(-5px);
            border-color: rgba(200,148,26,0.4);
        }

        .news-card__image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        .news-card__image-placeholder {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, rgba(200,148,26,0.08), rgba(255,255,255,0.02));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            opacity: 0.4;
        }

        .news-card__body {
            padding: 1.5rem;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .news-card__meta {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.75rem;
        }

        .news-card__category {
            font-family: 'Jost', sans-serif;
            font-size: 0.72rem;
            font-weight: 500;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #c8941a;
            background: rgba(200,148,26,0.1);
            border: 1px solid rgba(200,148,26,0.2);
            border-radius: 50px;
            padding: 0.2rem 0.7rem;
        }

        .news-card__date {
            font-family: 'Jost', sans-serif;
            font-size: 0.8rem;
            color: rgba(255,255,255,0.35);
        }

        .news-card__title {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 1.4rem;
            font-weight: 600;
            color: #ffffff;
            margin: 0 0 0.75rem;
            line-height: 1.3;
        }

        .news-card__summary {
            font-family: 'Jost', sans-serif;
            font-size: 0.9rem;
            font-weight: 300;
            color: rgba(255,255,255,0.55);
            line-height: 1.65;
            margin: 0 0 1.25rem;
            flex: 1;
        }

        .news-card__read-more {
            font-family: 'Jost', sans-serif;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #c8941a;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            transition: color 0.2s ease;
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
        }

        .news-card__read-more:hover { color: #fff; }

        /* Modal */
        .post-modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(6px);
            overflow-y: auto;
            padding: 2rem 1rem;
        }

        .post-modal.open {
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }

        .post-modal__inner {
            background: #111111;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            max-width: 740px;
            width: 100%;
            padding: 2.5rem;
            position: relative;
            margin: auto;
        }

        .post-modal__close {
            position: absolute;
            top: 1.25rem;
            right: 1.25rem;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.6);
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .post-modal__close:hover {
            background: rgba(255,255,255,0.12);
            color: #fff;
        }

        /* Share link button */
        .post-modal__share {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-family: 'Jost', sans-serif;
            font-size: 0.78rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.35);
            background: none;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 50px;
            padding: 0.35rem 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 0.5rem;
        }

        .post-modal__share:hover {
            color: #c8941a;
            border-color: rgba(200,148,26,0.3);
        }

        .post-modal__share.copied {
            color: #4caf50;
            border-color: rgba(76,175,80,0.3);
        }

        .post-modal__category {
            font-family: 'Jost', sans-serif;
            font-size: 0.72rem;
            font-weight: 500;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #c8941a;
            margin-bottom: 0.75rem;
        }

        .post-modal__title {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: clamp(1.8rem, 4vw, 2.6rem);
            font-weight: 600;
            color: #ffffff;
            margin: 0 0 0.5rem;
            line-height: 1.2;
        }

        .post-modal__date {
            font-family: 'Jost', sans-serif;
            font-size: 0.82rem;
            color: rgba(255,255,255,0.35);
            margin-bottom: 0.5rem;
        }

        .post-modal__featured-image {
            width: 100%;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            display: block;
        }

        .post-modal__content {
            font-family: 'Jost', sans-serif;
            font-size: 0.97rem;
            font-weight: 300;
            color: rgba(255,255,255,0.7);
            line-height: 1.8;
        }

        .post-modal__content h1,
        .post-modal__content h2,
        .post-modal__content h3 {
            font-family: 'Cormorant Garamond', Georgia, serif;
            color: #fff;
            margin-top: 1.5rem;
        }

        .post-modal__content p { margin-bottom: 1rem; }
        .post-modal__content a { color: #c8941a; text-decoration: underline; }
        .post-modal__content strong { color: #fff; font-weight: 500; }

        .post-modal__divider {
            border: none;
            border-top: 1px solid rgba(255,255,255,0.08);
            margin: 1.5rem 0;
        }

        .news-empty {
            text-align: center;
            padding: 6rem 2rem;
            color: rgba(255,255,255,0.3);
        }

        .news-empty h3 {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 1.6rem;
            color: rgba(255,255,255,0.5);
            margin-bottom: 0.5rem;
        }

        .news-loading {
            text-align: center;
            padding: 4rem;
            color: rgba(255,255,255,0.3);
            font-family: 'Jost', sans-serif;
            font-size: 0.9rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        @media (max-width: 600px) {
            .news-grid { grid-template-columns: 1fr; padding: 2rem 1rem; }
            .post-modal__inner { padding: 1.5rem; }
        }
    </style>
</head>
<body>

    <nav class="main-nav">
        <div class="nav-container">
            <a href="/" class="logo">
                <img src="images/misc/logo.png" alt="Once Upon A Dice" class="logo-image">
            </a>
            <div class="nav-links">
                <a href="/">Home</a>
                <a href="/games.html">Games</a>
                <a href="/events.html">Events</a>
                <a href="/news.html" class="active">News</a>
                <a href="/about.html">About</a>
                <a href="/contact.html">Contact</a>
            </div>
        </div>
    </nav>

    <section class="page-header">
        <div class="header-content">
            <h1>News & Updates</h1>
            <p>Game updates, behind-the-scenes stories, and announcements from the Once Upon A Dice studio.</p>
        </div>
    </section>

    <section>
        <div id="newsContainer">
            <div class="news-loading">Loading posts...</div>
        </div>
    </section>

    <div class="post-modal" id="postModal">
        <div class="post-modal__inner">
            <button class="post-modal__close" id="modalClose">✕</button>
            <div class="post-modal__category" id="modalCategory"></div>
            <h1 class="post-modal__title" id="modalTitle"></h1>
            <div class="post-modal__date" id="modalDate"></div>
            <button class="post-modal__share" id="modalShare">🔗 Copy Link</button>
            <hr class="post-modal__divider">
            <img class="post-modal__featured-image" id="modalImage" src="" alt="" style="display:none;">
            <div class="post-modal__content" id="modalBody"></div>
        </div>
    </div>

    <footer class="main-footer">
        <div class="footer-content">
            <p>&copy; 2026 Once Upon A Dice.</p>
            <div class="footer-links">
                <a href="/contact.html">Contact</a>
            </div>
        </div>
    </footer>

    <script>
    (function() {

        var allPosts = [];

        // Generate a URL-safe slug from a post title
        function slugify(title) {
            return (title || '')
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/^-+|-+$/g, '');
        }

        // Format date nicely
        function formatDate(dateStr) {
            try {
                var d = new Date(dateStr + 'T12:00:00');
                return d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
            } catch(e) { return dateStr; }
        }

        // Open full post modal and update URL hash
        function openPost(post) {
            document.getElementById('modalCategory').textContent = post.category || '';
            document.getElementById('modalTitle').textContent = post.title || '';
            document.getElementById('modalDate').textContent = formatDate(post.date);

            var img = document.getElementById('modalImage');
            if (post.image) {
                img.src = post.image;
                img.alt = post.title;
                img.style.display = 'block';
            } else {
                img.style.display = 'none';
            }

            var bodyEl = document.getElementById('modalBody');
            if (post.body && typeof marked !== 'undefined') {
                bodyEl.innerHTML = marked.parse(post.body);
            } else {
                bodyEl.textContent = post.body || '';
            }

            // Update URL hash and page title
            var slug = slugify(post.title);
            history.pushState({ slug: slug }, '', '#' + slug);
            document.title = (post.title || 'Post') + ' — Once Upon A Dice';

            // Wire up share button
            var shareBtn = document.getElementById('modalShare');
            shareBtn.className = 'post-modal__share';
            shareBtn.textContent = '🔗 Copy Link';
            shareBtn.onclick = function() {
                var url = window.location.origin + '/news.html#' + slug;
                navigator.clipboard.writeText(url).then(function() {
                    shareBtn.textContent = '✓ Copied!';
                    shareBtn.classList.add('copied');
                    setTimeout(function() {
                        shareBtn.textContent = '🔗 Copy Link';
                        shareBtn.classList.remove('copied');
                    }, 2000);
                });
            };

            document.getElementById('postModal').classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        // Close modal and clear hash
        function closeModal() {
            document.getElementById('postModal').classList.remove('open');
            document.body.style.overflow = '';
            history.pushState({}, '', window.location.pathname);
            document.title = 'News — Once Upon A Dice';
        }

        document.getElementById('modalClose').addEventListener('click', closeModal);
        document.getElementById('postModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeModal();
        });

        // Handle browser back button closing modal
        window.addEventListener('popstate', function() {
            if (!window.location.hash) {
                document.getElementById('postModal').classList.remove('open');
                document.body.style.overflow = '';
                document.title = 'News — Once Upon A Dice';
            }
        });

        // Render all news cards
        function renderNews(posts) {
            var container = document.getElementById('newsContainer');

            if (!posts || posts.length === 0) {
                container.innerHTML = '<div class="news-empty"><h3>No posts yet</h3><p>Check back soon for updates.</p></div>';
                return;
            }

            var sorted = posts.slice().sort(function(a, b) {
                return new Date(b.date) - new Date(a.date);
            });

            allPosts = sorted;

            var grid = document.createElement('div');
            grid.className = 'news-grid';

            sorted.forEach(function(post) {
                var card = document.createElement('article');
                card.className = 'news-card';
                card.setAttribute('data-slug', slugify(post.title));

                var imageHtml = post.image
                    ? '<img class="news-card__image" src="' + post.image + '" alt="' + (post.title || '') + '">'
                    : '<div class="news-card__image-placeholder">📰</div>';

                card.innerHTML =
                    imageHtml +
                    '<div class="news-card__body">' +
                        '<div class="news-card__meta">' +
                            '<span class="news-card__category">' + (post.category || 'News') + '</span>' +
                            '<span class="news-card__date">' + formatDate(post.date) + '</span>' +
                        '</div>' +
                        '<h2 class="news-card__title">' + (post.title || '') + '</h2>' +
                        '<p class="news-card__summary">' + (post.summary || '') + '</p>' +
                        '<button class="news-card__read-more">Read More →</button>' +
                    '</div>';

                card.querySelector('.news-card__read-more').addEventListener('click', function() {
                    openPost(post);
                });
                card.addEventListener('click', function(e) {
                    if (e.target.tagName !== 'BUTTON') openPost(post);
                });

                grid.appendChild(card);
            });

            container.innerHTML = '';
            container.appendChild(grid);

            // Check for hash on load and auto-open matching post
            var hash = window.location.hash.replace('#', '');
            if (hash) {
                var match = allPosts.find(function(p) {
                    return slugify(p.title) === hash;
                });
                if (match) openPost(match);
            }
        }

        // Fetch news data
        fetch('/_data/news.json')
            .then(function(res) {
                if (!res.ok) throw new Error('Failed to load news');
                return res.json();
            })
            .then(function(data) {
                renderNews(data.posts || []);
            })
            .catch(function(err) {
                console.error(err);
                document.getElementById('newsContainer').innerHTML =
                    '<div class="news-empty"><h3>Could not load posts</h3><p>Please try again later.</p></div>';
            });

    })();
    </script>

    <script>
        if (window.netlifyIdentity) {
            window.netlifyIdentity.on("init", function(user) {
                if (!user) {
                    window.netlifyIdentity.on("login", function() {
                        document.location.href = "/admin/";
                    });
                }
            });
        }
    </script>

</body>
</html>
